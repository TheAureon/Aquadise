<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- touch screens: no zooming, use the whole screen (round corners / notches: see safe areas in style.css) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title></title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="320" height="180"></canvas>
    <div id="ui"></div>
    <canvas id="touch"></canvas>
    <div id="rotate"><div class="phone"></div><div data-t="touch.rotate"></div><div class="small" data-t="touch.rotateSmall"></div></div>
    <div id="safe-probe"></div>
    <div id="loading"><div class="logo" data-t="game.name"></div><div id="loading-text" data-t="game.loading"></div></div>
  </div>

  <!-- languages first: every text the player sees comes from these (data/lang/, src/lang.js) -->
  <script src="src/lang.js"></script>
  <script src="data/lang/en.js"></script>
  <script>AQ.Lang.refresh(); AQ.Lang.fillPage();</script>   <!-- the page's own text (title, loading, rotate screen) -->

  <!-- data (edit these to add biomes / creatures / decorations) -->
  <script src="src/config.js"></script>
  <script src="data/glyphs.js"></script>
  <script src="data/sprite-spec.js"></script>
  <script src="data/world.js"></script>
  <script src="data/creatures.js"></script>
  <script src="data/decorations.js"></script>
  <script src="data/aquarium.js"></script>
  <script src="data/scenes.js"></script>
  <script src="data/music.js"></script>
  <script src="data/tutorial.js"></script>
  <script src="src/langdata.js"></script>          <!-- the data files' text, from data/lang/ -->
  <script src="assets/manifest.js"></script>
  <script src="assets/sprites-embedded.js"></script>
  <script src="assets/audio/embedded.js"></script>

  <!-- engine -->
  <script src="src/util.js"></script>
  <script src="src/placeholder-art.js"></script>
  <script src="src/input.js"></script>
  <script src="src/keys.js"></script>
  <script src="src/font.js"></script>
  <script src="src/assets.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/sfx.js"></script>
  <script src="src/ambience.js"></script>
  <script src="src/music.js"></script>
  <script src="src/world.js"></script>
  <script src="src/terrain.js"></script>
  <script src="src/fx.js"></script>
  <script src="src/render.js"></script>
  <script src="src/gulls.js"></script>
  <script src="src/shootingstars.js"></script>
  <script src="src/starfall.js"></script>
  <script src="src/tips.js"></script>
  <script src="src/dive.js"></script>
  <script src="src/guide.js"></script>
  <script src="src/savefile.js"></script>
  <script src="src/player.js"></script>
  <script src="src/transition.js"></script>
  <script src="src/miniworld.js"></script>
  <script src="src/scenes.js"></script>
  <script src="src/doors.js"></script>
  <script src="src/behaviors.js"></script>
  <script src="src/creatures.js"></script>
  <script src="src/catching.js"></script>
  <script src="src/collection.js"></script>
  <script src="src/panes.js"></script>            <!-- glass panes: the building material for the tanks -->
  <script src="src/tanks.js"></script>
  <script src="src/sexes.js"></script>
  <script src="src/clock.js"></script>
  <script src="src/breeding.js"></script>
  <script src="src/nursery.js"></script>
  <script src="src/vibe.js"></script>
  <script src="src/chests.js"></script>
  <script src="src/bottles.js"></script>
  <script src="src/save.js"></script>
  <script src="src/aquarium.js"></script>
  <script src="src/hill.js"></script>
  <script src="src/station.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/hud.js"></script>
  <script src="src/title.js"></script>
  <script src="src/soundtest.js"></script>
  <script src="src/touch.js"></script>
  <script src="src/sounddirector.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
